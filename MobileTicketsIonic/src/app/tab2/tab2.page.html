<ion-header>
  <ion-toolbar>
    <ion-title>Atendimentos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Senha Atual</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <h1>{{ senhaAtual }}</h1>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Próxima da Fila</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <h2>{{ proximaSenha }}</h2>
    </ion-card-content>
  </ion-card>

  <ion-button
    expand="block"
    color="primary"
    (click)="chamarProxima()">
    Chamar Próxima
  </ion-button>

  <ion-button
    expand="block"
    color="success"
    (click)="finalizarAtendimento()">
    Finalizar Atendimento
  </ion-button>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Últimas Chamadas</ion-card-title>
    </ion-card-header>

    <p>Histórico: {{ historico.length }}</p>
    <ion-card-content>
      <div *ngFor="let senha of historico">
        {{ senha }}
      </div>
    </ion-card-content>
  </ion-card>

</ion-content>
